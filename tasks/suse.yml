---
# tasks file for logrotate — SUSE / openSUSE
#
# Requires the community.general collection:
#   ansible-galaxy collection install -r requirements.yml
#
# Note: lineinfile-based config management (compress, rotate count, etc.) has
# been removed. All logrotate.conf configuration is now handled exclusively
# by the Jinja2 template (templates/etc/logrotate.conf.j2) via logrotate_options
# or the per-distro logrotate_distribution_options in vars/Suse.yml.

- name: Install logrotate packages (zypper)
  become: true
  community.general.zypper:
    name: "{{ logrotate_packages }}"
    state: present
  register: register_install_package
  until: register_install_package is succeeded
  retries: 3
  tags: logrotate
