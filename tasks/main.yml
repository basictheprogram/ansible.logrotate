---
# tasks file for logrotate

- name: Rotate log as this user and group
  lineinfile: >
      dest="/etc/logrotate.conf"
      regexp="^su root syslog"
      insertbefore="BOF"
      line="su root syslog\n"
      state="present"
  when: "{{ ansible_lsb.release }} >= 14.04"
  tags: logrotate

- name: Remove "su root syslog" if {{ ansible_lsb.release }} < 14.04
  lineinfile: >
      dest="/etc/logrotate.conf"
      regexp="^su root syslog"
      state="absent"
  when: "{{ ansible_lsb.release }} < 14.04"  
  tags: logrotate
  
- name: logrotate compress on
  lineinfile: >
      dest="/etc/logrotate.conf"
      regexp="^#compress"
      line="compress"
      backrefs="yes"
  tags: logrotate
  
- name: logrotate 32 weeks of backlogs (comment)
  lineinfile: >
      dest="/etc/logrotate.conf"
      regexp="^# keep [0-9]* weeks worth of backlogs"
      line="# keep 32 weeks of backlogs"
      backrefs="yes"
  tags: logrotate
    
- name: logrotate 32 weeks of backlogs
  lineinfile: >
      dest="/etc/logrotate.conf"
      regexp="^rotate [^32]"
      line="rotate 32"
      backrefs="yes"
  tags: logrotate
  
