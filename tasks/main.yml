---
# tasks file for logrotate

- name: logrotate compress on
  lineinfile: >
      dest=/etc/logrotate.conf
      regexp="^#compress"
      line="compress"
      backrefs=yes
  tags: logrotate
  
- name: logrotate 32 weeks of backlogs (comment)
  lineinfile: >
      dest=/etc/logrotate.conf 
      regexp="^# keep [0-9]* weeks worth of backlogs"
      line="# keep 32 weeks of backlogs"
      backrefs=yes
  tags: logrotate
    
- name: logrotate 32 weeks of backlogs
  lineinfile: >
      dest=/etc/logrotate.conf
      regexp="^rotate [^32]"
      line="rotate 32"
      backrefs=yes
  tags: logrotate
  
- name: Rotate log as this user and group
  lineinfile: >
      dest=/etc/logrotate.conf
      line="su root syslog"
  tags: logrotate