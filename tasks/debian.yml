---
# tasks file for logrotate — Debian / Ubuntu
#
# Note: Ubuntu < 14.04 compatibility (ansible_lsb.release checks) has been
# removed. Ubuntu 14.04 reached end-of-life in April 2019 and ansible_lsb
# was removed in ansible-core 2.13+.

- name: Install logrotate packages (apt)
  become: true
  ansible.builtin.apt:
    name: "{{ logrotate_packages }}"
    state: present
    install_recommends: false
    force_apt_get: true
  register: register_install_package
  until: register_install_package is succeeded
  retries: 3
  tags: logrotate
